kind = "web"
previewPath = "/"
title = "Creative Agency"
version = "1.0.0"
id = "artifacts/active-theory-site"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22299
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/active-theory-site run dev"

[services.env]
PORT = "22299"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/active-theory-site", "run", "build"]
publicDir = "artifacts/active-theory-site/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
